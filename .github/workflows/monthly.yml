name: Update the 12-month averages

on:
  schedule:
    - cron: '20 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fetch_year.py
      - name: Save the new averages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add year.json
          git diff --staged --quiet || git commit -m "Update 12-month averages"
          git push
